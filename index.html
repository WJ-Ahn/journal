<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SNS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="signin-screen" class="screen">
    <div class="signin-box">
      <p class="signin-title">My SNS</p>
      <p class="signin-sub">Google Drive에 저장됩니다</p>
      <div id="google-signin-btn"></div>
    </div>
  </div>

  <div id="app-screen" class="screen" style="display:none;">
    <header class="app-header">
      <button id="conn-status-btn" class="ghost-icon-btn conn-status" data-state="connected" title="연결 상태">
        <span class="status-dot"></span>
      </button>
      <div class="header-right">
        <button id="search-btn" class="ghost-icon-btn" title="검색"></button>
        <button id="menu-btn" class="ghost-icon-btn" title="메뉴"></button>
      </div>
    </header>

    <div id="search-panel" class="search-panel">
      <div class="search-panel-inner">
        <input id="search-input" type="text" class="search-input" placeholder="내용, 초성, 날짜(2026 / 202609 / 20260908)로 검색" />
      </div>
    </div>

    <div id="menu-panel" class="menu-panel">
      <div class="menu-panel-inner">
        <div class="menu-row">
          <span>다크 모드</span>
          <button id="theme-toggle" class="switch" role="switch" aria-checked="false"><span class="switch-knob"></span></button>
        </div>
      </div>
    </div>

    <main id="feed" class="feed"></main>

    <footer class="composer">
      <div id="composer-image-preview" class="composer-image-preview" style="display:none;">
        <img id="composer-image-tag" src="" alt="" />
        <button id="composer-image-remove" class="image-remove-btn">✕</button>
      </div>
      <div class="composer-row">
        <button id="composer-image-btn" class="ghost-icon-btn" title="사진 추가"></button>
        <input id="composer-file-input-camera" type="file" accept="image/*" capture="environment" style="display:none;" />
        <input id="composer-file-input-gallery" type="file" accept="image/*" style="display:none;" />
        <textarea id="composer-text" rows="1" placeholder=""></textarea>
        <button id="composer-post-btn" class="send-btn" disabled title="남기기"></button>
      </div>
    </footer>

    <div id="photo-modal-overlay" class="modal-overlay" style="display:none;">
      <div class="modal-sheet">
        <button id="photo-camera-btn" class="modal-option">카메라로 촬영</button>
        <button id="photo-gallery-btn" class="modal-option">갤러리에서 선택</button>
        <button id="photo-cancel-btn" class="modal-cancel">취소</button>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
  <script src="drive.js"></script>
  <script src="app.js"></script>
</body>
</html>
