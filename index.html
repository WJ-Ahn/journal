<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SNS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="signin-screen" class="screen">
    <div class="signin-box">
      <p class="signin-title">My SNS</p>
      <p class="signin-sub">Google Drive에 저장됩니다</p>
      <div id="google-signin-btn"></div>
    </div>
  </div>

  <div id="app-screen" class="screen" style="display:none;">
    <header class="app-header">
      <button id="conn-status-btn" class="ghost-icon-btn conn-status" data-state="connected" title="연결 상태">
        <span class="status-dot"></span>
      </button>
      <div class="header-right">
        <input id="search-input" type="text" class="search-input-inline" />
        <button id="search-btn" class="ghost-icon-btn" title="검색"></button>
        <button id="menu-btn" class="ghost-icon-btn" title="메뉴"></button>
      </div>
    </header>

    <div id="menu-panel" class="menu-panel">
      <div class="menu-panel-inner">
        <div class="menu-row">
          <span>다크 모드</span>
          <button id="theme-toggle" class="switch" role="switch" aria-checked="false"><span class="switch-knob"></span></button>
        </div>
      </div>
    </div>

    <!-- 저널 화면 (피드) -->
    <main id="feed" class="feed"></main>

    <!-- 캘린더 화면 (舊 LOG 앱, 저널에 종속된 두 번째 화면 — 자체 헤더/메뉴 없음) -->
    <section id="calendarView" class="hidden">
      <div id="calendarMonthSection">
        <section class="calendar-header">
          <button id="calPrevBtn" class="icon-btn" title="이전 달">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <span id="calMonthLabel" class="calendar-month-label"></span>
          <input type="text" id="calMonthLabelInput" class="calendar-month-input hidden" inputmode="numeric" placeholder="202609" maxlength="6">
          <button id="calNextBtn" class="icon-btn" title="다음 달">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </section>

        <section class="calendar-grid calendar-weekdays">
          <span class="calendar-weekday">일</span>
          <span class="calendar-weekday">월</span>
          <span class="calendar-weekday">화</span>
          <span class="calendar-weekday">수</span>
          <span class="calendar-weekday">목</span>
          <span class="calendar-weekday">금</span>
          <span class="calendar-weekday">토</span>
        </section>

        <section class="calendar-grid" id="calendarGrid">
          <!-- 날짜 셀 렌더링 위치 -->
        </section>
      </div>

      <section id="calComposer" class="cal-composer">
        <div class="cal-composer-inner">
          <div class="cal-composer-header">
            <span id="calComposerDate" class="cal-composer-date"></span>
            <input type="text" id="calEntryTime" class="mono-input cal-time-input" inputmode="numeric" placeholder="0000" maxlength="5">
          </div>
          <textarea id="calEntryBody" class="autosize" rows="3"></textarea>
          <textarea id="calEntryMemo" class="memo-textarea autosize" rows="2"></textarea>
          <div class="cal-composer-actions">
            <button id="calDeleteBtn" class="btn-ghost small danger hidden">삭제</button>
            <button id="calSaveBtn" class="btn-primary small">등록</button>
          </div>
        </div>
      </section>

      <section class="calendar-log-list" id="calendarLogList">
        <!-- 이번 달 로그 목록 렌더링 위치 -->
      </section>

      <p id="calendarEmptyState" class="empty-state hidden">이 달에는 기록이 없어요.</p>
    </section>

    <!-- 저널 화면 전용 작성창 (캘린더 화면에서는 숨김) -->
    <footer class="composer" id="journal-composer">
      <div id="composer-image-preview" class="composer-image-preview" style="display:none;">
        <img id="composer-image-tag" src="" alt="" />
        <button id="composer-image-remove" class="image-remove-btn">✕</button>
      </div>
      <div class="composer-row">
        <button id="composer-image-btn" class="ghost-icon-btn" title="사진 추가"></button>
        <input id="composer-file-input-camera" type="file" accept="image/*" capture="environment" style="display:none;" />
        <input id="composer-file-input-gallery" type="file" accept="image/*" style="display:none;" />
        <textarea id="composer-text" rows="1" placeholder=""></textarea>
        <button id="composer-post-btn" class="send-btn" disabled title="남기기"></button>
      </div>
    </footer>
  </div>

  <!-- 화면 전환: 저널 ↔ 캘린더 (좌우 어느 쪽을 눌러도 서로 토글) -->
  <button id="viewPrevBtn" class="fab-nav fab-nav-left" title="이전 화면">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button id="viewNextBtn" class="fab-nav fab-nav-right" title="다음 화면">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <div id="photo-modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-sheet">
      <button id="photo-camera-btn" class="modal-option">카메라로 촬영</button>
      <button id="photo-gallery-btn" class="modal-option">갤러리에서 선택</button>
      <button id="photo-cancel-btn" class="modal-cancel">취소</button>
    </div>
  </div>

  <!-- 삭제 확인 모달 (캘린더 전용, 브라우저 기본 confirm() 대체) -->
  <div id="confirmModal" class="confirm-modal hidden">
    <div class="confirm-modal-box">
      <p id="confirmModalMessage" class="confirm-modal-message"></p>
      <div class="confirm-modal-actions">
        <button id="confirmModalCancelBtn" class="btn-ghost small">취소</button>
        <button id="confirmModalOkBtn" class="btn-ghost small danger">삭제</button>
      </div>
    </div>
  </div>

  <!-- 상태 메시지 (화면 정중앙, 캘린더 등록/수정/삭제/유효성 피드백용) -->
  <div id="statusBar" class="status-bar hidden"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
  <script src="drive.js"></script>
  <script src="app.js"></script>
</body>
</html>
